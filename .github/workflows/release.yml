name: Release

# Publishes a version: it runs the CI checks, publishes the npm package, creates the
# GitHub release, and bumps the Homebrew tap formula. Every step skips itself when its
# work is already done, so a failed run can be re-run, and a tag for a version that is
# already on npm still gets its GitHub release and tap bump.
#
# Two ways in:
#   - Every push to main (a merged pull request) publishes the next version, chosen by
#     scripts/next-version.mjs: a patch bump of the newest tag, or package.json's version
#     when a pull request raised it for a minor or major release. main is protected, so
#     nothing commits the version back: the workflow creates the tag itself and sets the
#     version in this run's checkout only (package.json on main keeps its last manual
#     value). The release notes come from docs/releases/vX.Y.Z.md when that file exists,
#     otherwise GitHub generates them from the merged pull requests.
#   - Pushing a vX.Y.Z tag by hand still works as before: the tag must match
#     package.json, be on main, and have docs/releases/vX.Y.Z.md.
#
# The tag the workflow creates is pushed with the job token. GitHub does not start
# workflows from pushes made with that token, so the tag does not re-trigger this
# workflow. Do not swap in a personal token for it, or every release would run twice.
#
# One-time setup this workflow depends on (neither is a stored npm token):
#   - npm trusted publisher for the `beadscope` package: repository
#     sai-manoj-kumar/beadscope, workflow release.yml. npm then accepts this job's
#     OIDC identity and records a provenance attestation.
#   - TAP_DEPLOY_KEY secret: the private half of a write-enabled deploy key on
#     sai-manoj-kumar/homebrew-beadscope. It can push to that one repository only.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Decides the tag to publish: the pushed tag, or for a push to main the next version.
  # Runs are serialized by the concurrency group above, so each one sees the tag the
  # previous run created.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pick the version
        id: pick
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            mode=tag
          else
            tag="v$(node scripts/next-version.mjs)"
            mode=main
          fi
          echo "Publishing $tag ($mode)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  check:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
      MODE: ${{ needs.version.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only after CI has passed, so a red main does not use up a version number. If the
      # commit is already tagged (a re-run), this is a no-op.
      - name: Create the tag
        if: env.MODE == 'main'
        run: |
          if existing="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}")"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on $existing, not on $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already points at this commit"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Verify the tag
        if: env.MODE == 'tag'
        run: |
          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $package_version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main. Release from a commit that has been merged."
            exit 1
          fi
          if [ ! -f "docs/releases/$TAG.md" ]; then
            echo "::error::docs/releases/$TAG.md is missing"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # The version exists only in this checkout (see the header). prepack builds with it,
      # so the published app reports the right version.
      - name: Set the version
        if: env.MODE == 'main'
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # prepack runs `next build`, and publishConfig turns provenance on.
      - name: Publish to npm
        run: |
          version="${TAG#v}"
          if npm view "beadscope@$version" version >/dev/null 2>&1; then
            echo "beadscope@$version is already on npm; skipping publish"
          else
            npm publish
          fi

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping"
            exit 0
          fi
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            title="$(sed -n '1s/^# //p' "$notes")"
            tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --verify-tag --title "${title:-$TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # An automatic patch release has no hand-written notes: list the merged pull requests.
            gh release create "$TAG" --verify-tag --title "Beadscope $TAG" --generate-notes
          fi

  tap:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - name: Hash the published tarball
        run: |
          version="${TAG#v}"
          url="https://registry.npmjs.org/beadscope/-/beadscope-$version.tgz"
          # npm accepts a publish before it serves the tarball: v0.5.1 took about 22
          # minutes. Back off exponentially (5s, 10s, 20s ... capped at 2 minutes) and
          # give up after 45 minutes.
          deadline=$((SECONDS + 45 * 60))
          delay=5
          attempt=1
          until curl -fsSL "$url" -o "$RUNNER_TEMP/beadscope.tgz" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$url was still not available after 45 minutes"
              exit 1
            fi
            echo "Attempt $attempt: tarball not served yet, retrying in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2 > 120 ? 120 : delay * 2))
          done
          {
            echo "TARBALL_URL=$url"
            echo "TARBALL_SHA=$(sha256sum "$RUNNER_TEMP/beadscope.tgz" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Update the tap formula
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::The TAP_DEPLOY_KEY secret is not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone git@github.com:sai-manoj-kumar/homebrew-beadscope.git tap
          cd tap
          perl -pi -e 's{^(\s*url ").*(")}{$1$ENV{TARBALL_URL}$2}; s{^(\s*sha256 ").*(")}{$1$ENV{TARBALL_SHA}$2}' Formula/beadscope.rb

          if git diff --quiet; then
            echo "The formula already points at ${TAG#v}; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "beadscope ${TAG#v}"
          git push origin HEAD:main
